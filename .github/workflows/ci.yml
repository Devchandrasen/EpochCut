name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run executable quick start
        run: python examples/quickstart.py

      - name: Run retained-epoch walkthrough
        run: python examples/temporal_quickstart.py

      - name: Verify frozen research artifacts
        run: python scripts/verify_artifacts.py

      - name: Verify temporal evidence and isolated reanalysis
        run: python scripts/verify_temporal_artifacts.py --reanalyse

      - name: Check presentation data, visual hashes and documentation links
        run: python scripts/verify_project_showcase.py

      - name: Confirm the evidence manifest is reproducible
        run: git diff --exit-code -- results/analysis/MANIFEST.sha256.json
