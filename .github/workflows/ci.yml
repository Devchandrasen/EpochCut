name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run executable quick start
        run: python examples/quickstart.py

      - name: Run retained-epoch walkthrough
        run: python examples/temporal_quickstart.py

      - name: Enforce code and documentation scope
        run: python scripts/check_repository.py

      - name: Check conceptual visuals and editable diagram exports
        run: python scripts/verify_project_showcase.py
